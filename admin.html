function cashForm(){let eligible=db.invoices.filter(i=>i.status!=='Void'&&i.status!=='Paid');openModal('Record Cash Payment',`<form id="cashform" class="formgrid"><label class="field full">Unpaid invoice<select name="invoice" required>${eligible.map(i=>`<option value="${i.id}">${esc(i.number)} · ${esc(db.carriers.find(c=>c.id===i.carrier)?.name||'Archived')} · ${money(i.amount)}</option>`).join('')}</select></label><label class="field">Amount received ($)<input name="amount" type="number" step="0.01" min="0.01" required></label><label class="field">Date received<input name="received" type="date" value="${date()}" required></label><label class="field">Received by<input name="receivedBy" maxlength="100" required placeholder="Staff member"></label><label class="field">Receipt / reference<input name="reference" maxlength="100" placeholder="Optional"></label><label class="field full">Notes<input name="notes" maxlength="300" placeholder="Optional internal notes"></label><div class="notice full">For this prototype, cash payments must equal the full invoice amount. Partial payments are not supported.</div><div class="actions full"><button class="btn primary" ${eligible.length?'':'disabled'}>Save Cash Receipt</button></div></form>`);let f=$('#cashform');f.onsubmit=e=>{e.preventDefault();let data=new FormData(f),i=db.invoices.find(x=>x.id===Number(data.get('invoice'))),amount=Number(data.get('amount'));if(!i||i.status==='Paid'||i.status==='Void'){toast('Select an unpaid invoice');return}if(!Number.isFinite(amount)||Math.abs(amount-Number(i.amount))>.005){toast('Cash amount must equal invoice total '+money(i.amount));return}let id=Date.now(),r={id,receipt:'CASH-'+String(id).slice(-9),invoice:i.id,carrier:i.carrier,date:String(data.get('received')),amount,receivedBy:String(data.get('receivedBy')).trim(),reference:String(data.get('reference')).trim(),notes:String(data.get('notes')).trim()};if(!r.receivedBy){toast('Enter received by');return}db.cashReceipts.unshift(r);i.status='Paid';i.paymentMethod='Cash';i.paymentDate=r.date;i.paymentReference=r.receipt;i.paymentNotes=r.notes;log('Recorded cash receipt',r.receipt+' · '+i.number);closeModal();render();receiptModal(r.id)}}
function receiptModal(id){let r=db.cashReceipts.find(x=>x.id===id);if(!r)return;let i=db.invoices.find(x=>x.id===r.invoice);openModal('Cash Receipt '+r.receipt,`<div class="kv"><b>Receipt</b>${esc(r.receipt)}</div><div class="kv"><b>Date</b>${esc(r.date)}</div><div class="kv"><b>Carrier</b>${esc(db.carriers.find(c=>c.id===r.carrier)?.name||'Archived')}</div><div class="kv"><b>Invoice</b>${esc(i?.number||'—')}</div><div class="kv"><b>Amount</b><strong>${money(r.amount)}</strong></div><div class="kv"><b>Received by</b>${esc(r.receivedBy)}</div><div class="kv"><b>Reference</b>${esc(r.reference||'—')}</div><div class="kv"><b>Notes</b>${esc(r.notes||'—')}</div><p class="muted small">Browser-only demo receipt, not proof of actual funds transfer.</p><div class="actions"><button class="btn primary" id="printreceipt">Print / Save PDF</button></div>`);$('#printreceipt').onclick=()=>window.print()}
function exportCash(){let rows=[['Receipt','Date','Carrier','Invoice','Amount USD','Received by','Reference','Notes'],...db.cashReceipts.map(r=>[r.receipt,r.date,db.carriers.find(c=>c.id===r.carrier)?.name||'',db.invoices.find(i=>i.id===r.invoice)?.number||'',r.amount.toFixed(2),r.receivedBy,r.reference,r.notes])];let csv=rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='fleetcomply-cash-ledger.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}

function openModal(title,body){$('#modalhost').innerHTML=`<div class="modalback" id="backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="row"><h2>${esc(title)}</h2><button class="btn" id="closemodal">✕</button></div>${body}</div></div>`;$('#closemodal').onclick=closeModal;$('#backdrop').onclick=e=>{if(e.target.id==='backdrop')closeModal()}}function closeModal(){$('#modalhost').innerHTML=''}

e(x=>x.dot===dot&&x.id!==id)){toast('A carrier with this DOT number already exists');return}let item={id:id||Date.now(),name,dot,mc:String(f.get('mc')).trim(),contact:email,drivers:Number(f.get('drivers')),trucks:Number(f.get('trucks')),status:String(f.get('status')),notes:String(f.get('notes')).trim(),plan:String(f.get('plan')),specialist:c.specialist||null,created:id?c.created:date()};if(id)db.carriers=db.carriers.map(x=>x.id===id?item:x);else db.carriers.push(item);log(id?'Updated carrier':'Created carrier',name);closeModal();selectedCarrier=id||item.id;render();toast('Carrier saved locally')}}

function userForm(id){let u=db.users.find(x=>x.id===id)||{name:'',email:'',role:'Support Agent',status:'Active',carrier:'Platform'};openModal(id?'Edit User':'Add User',`<form id="userform" class="formgrid"><label class="field">Name<input name="name" required value="${esc(u.name)}"></label><label class="field">Email<input type="email" name="email" required value="${esc(u.email)}"></label><label class="field">Role<select name="role">${['Platform Admin','Billing Admin','Support Agent','Compliance Specialist','Carrier Owner','Carrier Safety Manager'].map(x=>`<option ${u.role===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field">Workspace<select name="carrier">${['Platform',...db.carriers.map(c=>c.name)].map(x=>`<option ${u.carrier===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label><label class="field">Status<select name="status">${['Active','Suspended'].map(x=>`<option ${u.status===x?'selected':''}>${x}</option>`).join('')}</select></label><div class="actions full"><button class="btn primary">Save Demo User</button></div></form>`);$('#userform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),item={id:id||Date.now(),name:String(f.get('name')),email:String(f.get('email')),role:String(f.get('role')),carrier:String(f.get('carrier')),status:String(f.get('status'))};if(id)db.users=db.users.map(x=>x.id===id?item:x);else db.users.push(item);log(id?'Updated user':'Created user',item.email);closeModal();render()}}
function ticketForm(id){let t=db.tickets.find(x=>x.id===id)||{carrier:db.carriers[0]?.id||0,subject:'',priority:'Medium',status:'Open'};openModal(id?'Manage Ticket':'New Support Ticket',`<form id="ticketform" class="formgrid"><label class="field full">Carrier<select name="carrier">${db.carriers.map(c=>`<option value="${c.id}" ${t.carrier===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label class="field full">Subject<input name="subject" required value="${esc(t.subject)}"></label><label class="field">Priority<select name="priority">${['Low','Medium','High','Urgent'].map(x=>`<option ${t.priority===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field">Status<select name="status">${['Open','Pending','Resolved'].map(x=>`<option ${t.status===x?'selected':''}>${x}</option>`).join('')}</select></label><div class="actions full"><button class="btn primary">Save Ticket</button></div></form>`);$('#ticketform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),item={id:id||Date.now(),carrier:Number(f.get('carrier')),subject:String(f.get('subject')),priority:String(f.get('priority')),status:String(f.get('status'))};if(id)db.tickets=db.tickets.map(x=>x.id===id?item:x);else db.tickets.push(item);log(id?'Updated ticket':'Created ticket',item.subject);closeModal();render()}}
function bind(){carrierButtons();let b=$('#addcarrier');if(b)b.onclick=()=>carrierForm();b=$('#backcarriers');if(b)b.onclick=()=>{selectedCarrier=null;render()};b=$('#editcarrier');if(b)b.onclick=()=>carrierForm(selectedCarrier);b=$('#togglecarrier');if(b)b.onclick=()=>{let c=db.carriers.find(x=>x.id===selectedCarrier);if(!confirm((c.status==='Suspended'?'Reactivate':'Suspend')+' '+c.name+'?'))return;c.status=c.status==='Suspended'?'Active':'Suspended';log('Changed carrier status',c.name+' → '+c.status);render()};b=$('#previewinvoice');if(b)b.onclick=()=>{let c=db.carriers.find(x=>x.id===selectedCarrier);openModal('Invoice Preview',`<p>${esc(c.name)}</p><div class="kv"><b>Active drivers</b>${c.drivers}</div><div class="kv"><b>Plan</b>${esc(c.plan||'Self-Service')}</div><div class="kv"><b>Driver rate</b>${money(c.plan==='Managed Compliance'?MANAGED_RATE:RATE)}</div><div class="kv"><b>Minimum</b>${money(c.plan==='Managed Compliance'?MANAGED_MIN:MIN)}</div><div class="kv"><b>Trucks</b>Included (${c.trucks})</div><div class="kv"><b>Monthly total</b><strong>${money(bill(c))}</strong></div><p class="muted small">Preview only. No invoice created and no payment collected.</p>`)};b=$('#carrierworkspace');if(b)b.onclick=()=>window.open('index.html','_blank','noopener');b=$('#search');if(b)b.oninput=e=>{search=e.target.value;let cursor=e.target.selectionStart;render();let x=$('#search');x.focus();x.setSelectionRange(cursor,cursor)};b=$('#filter');if(b)b.onchange=e=>{statusFilter=e.target.value;render()};b=$('#recordcash');if(b)b.onclick=()=>cashForm();b=$('#exportcash');if(b)b.onclick=()=>exportCash();document.querySelectorAll('[data-receipt]').forEach(b=>b.onclick=()=>receiptModal(Number(b.dataset.receipt)));b=$('#generate');if(b)b.onclick=()=>invoiceCreateForm();document.querySelectorAll('[data-invoice]').forEach(b=>b.onclick=()=>invoiceModal(Number(b.dataset.invoice)));b=$('#adduser');if(b)b.onclick=()=>userForm();b=$('#addtask');if(b)b.onclick=()=>taskForm();document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>taskForm(Number(b.dataset.task)));document.querySelectorAll('[data-assign]').forEach(b=>b.onclick=()=>assignmentForm(Number(b.dataset.assign)));document.querySelectorAll('[data-user]').forEach(b=>b.onclick=()=>userForm(Number(b.dataset.user)));document.querySelectorAll('[data-feature]').forEach(b=>b.onchange=e=>{db.features[e.target.dataset.feature]=e.target.checked;log('Changed feature flag',e.target.dataset.feature+' → '+(e.target.checked?'On':'Off'));toast('Saved demo feature flag')});document.querySelectorAll('[data-integration]').forEach(b=>b.onclick=()=>openModal(b.dataset.integration,`<p>This provider is not connected.</p><p>Production setup requires a provider agreement, authorized tenant consent, secure server-side credentials, sync/error monitoring and provider-specific API development.</p><div class="notice">No live FMCSA, SambaSafety, ELD or payment integration is included.</div>`));b=$('#addticket');if(b)b.onclick=()=>ticketForm();document.querySelectorAll('[data-ticket]').forEach(b=>b.onclick=()=>ticketForm(Number(b.dataset.ticket)));b=$('#settingsform');if(b)b.onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db.settings={brand:String(f.get('brand')),support:String(f.get('support')),trial:Number(f.get('trial')),grace:Number(f.get('grace')),annual:Number(f.get('annual'))};log('Updated platform settings',db.settings.brand);render();toast('Settings saved locally')};b=$('#resetdemo');if(b)b.onclick=()=>{if(!confirm('Reset all Super Admin demo data on this browser?'))return;db=clone(seed);save();selectedCarrier=null;render();toast('Demo data reset')}}
$('#menubtn').onclick=()=>$('#sidebar').classList.toggle('open');try{render()}catch(e){console.error(e);$('#content').innerHTML='<div class="card"><h2>Dashboard could not load</h2><p>Please open this HTML in Safari or GitHub Pages.</p><pre style="white-space:pre-wrap">'+esc(e.message)+'</pre></div>'}
</script></body></html>
